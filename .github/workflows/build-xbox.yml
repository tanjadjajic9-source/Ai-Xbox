name: Build Xbox OT-FM MSIX Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-xbox-msix:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NuGet & MSBuild
        uses: nuget/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2

      - name: Deep Organize Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "xbox-uwp\src","xbox-uwp\src\Shaders","dist-xbox" | Out-Null

          Get-ChildItem -Path . -Recurse -File | ForEach-Object {
            $name = $_.Name
            $ext = $_.Extension.ToLower()
            $full = $_.FullName

            if ($full -like "*\dist-xbox\*") { return }

            if ($ext -eq ".sln" -or $name -like "*.vcxproj*" -or $ext -eq ".appxmanifest" -or $name -eq "packages.config") {
              $dest = Join-Path (Get-Location) "xbox-uwp\$name"
              if ($full -ne $dest) { Copy-Item $full -Destination $dest -Force }
            } elseif ($ext -in ".cpp", ".h") {
              $dest = Join-Path (Get-Location) "xbox-uwp\src\$name"
              if ($full -ne $dest) { Copy-Item $full -Destination $dest -Force }
            } elseif ($ext -eq ".hlsl") {
              $dest = Join-Path (Get-Location) "xbox-uwp\src\Shaders\$name"
              if ($full -ne $dest) { Copy-Item $full -Destination $dest -Force }
            }
          }

          # 1. Put NOMINMAX at the very top of every file so Windows min/max never collides
          Get-ChildItem -Path "xbox-uwp\src" -Recurse -Include *.cpp,*.h | ForEach-Object {
            $raw = Get-Content $_.FullName -Raw
            if (-not ($raw.StartsWith("#ifndef NOMINMAX"))) {
              $shield = "#ifndef NOMINMAX`r`n#define NOMINMAX`r`n#endif`r`n#ifndef WIN32_LEAN_AND_MEAN`r`n#define WIN32_LEAN_AND_MEAN`r`n#endif`r`n"
              Set-Content $_.FullName -Value ($shield + $raw)
            }
          }

          # 2. Add missing Storage header to FMBrain.cpp for InstalledLocation
          $fmBrain = (Get-ChildItem -Path "xbox-uwp\src" -Recurse -Filter "FMBrain.cpp" | Select-Object -First 1).FullName
          if ($fmBrain) {
            $c = Get-Content $fmBrain -Raw
            if (-not ($c -like "*<winrt/Windows.Storage.h>*")) {
              $c = $c -replace '#include "FMBrain.h"', "#include `"FMBrain.h`"`r`n#include <winrt/Windows.Storage.h>"
              Set-Content $fmBrain -Value $c
            }
          }

          Write-Host "=== Files in xbox-uwp\src ==="
          Get-ChildItem "xbox-uwp\src" | Select-Object -ExpandProperty Name

      - name: Generate Placeholder App Icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $assetsDir = "xbox-uwp\Assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null
          $specs = @{
            "StoreLogo.png" = @(50, 50)
            "Square44x44Logo.png" = @(44, 44)
            "Square150x150Logo.png" = @(150, 150)
            "Wide310x150Logo.png" = @(310, 150)
            "SplashScreen.png" = @(620, 300)
          }
          foreach ($name in $specs.Keys) {
            $w, $h = $specs[$name]
            $bmp = New-Object System.Drawing.Bitmap($w, $h)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(11, 15, 20))
            $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(34, 197, 94))
            $g.FillRectangle($brush, [int]($w * 0.25), [int]($h * 0.25), [int]($w * 0.5), [int]($h * 0.5))
            $bmp.Save((Join-Path $assetsDir $name), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose()
            $bmp.Dispose()
          }

      - name: Precompile FMCompute GPU Shaders
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $fxc = Join-Path $sdkBin.FullName "x64\fxc.exe"
          $entries = @("CSEncodeSineOperators", "CSConvForward", "CSAddResidual", "CSMSELossGrad", "CSConvBackwardInput", "CSSiLUBackward", "CSConvBackwardWeights", "CSAdamUpdate")
          $hlsl = (Get-ChildItem -Recurse -Filter "FMCompute.hlsl" | Select-Object -First 1).FullName
          (Get-Content $hlsl) -replace 'RWStructuredBuffer<float>\s+gOutC\s*:', 'RWStructuredBuffer<float> gOutC_Buf :' -replace '\bgOutC\[', 'gOutC_Buf[' | Set-Content $hlsl
          New-Item -ItemType Directory -Force -Path "xbox-uwp\Shaders" | Out-Null
          foreach ($entry in $entries) {
            & $fxc /nologo /T cs_5_1 /E $entry /Fo "xbox-uwp\Shaders\$entry.cso" $hlsl
          }

      - name: Create Self-Signed Xbox Dev Certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=XboxOTFMDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Xbox OT-FM Dev Signing Cert" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "XboxOTFM2026!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "xbox-uwp\XboxOTFM_Cert.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath "dist-xbox\XboxOTFM_Cert.cer" | Out-Null

      - name: Match SDK and Turn Off PCH Requirement
        shell: pwsh
        run: |
          $sdkVer = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          Write-Host "Auto-detected Windows SDK version: $sdkVer"
          (Get-Content "xbox-uwp\App.vcxproj") `
            -replace '<WindowsTargetPlatformVersion>.*?</WindowsTargetPlatformVersion>', "<WindowsTargetPlatformVersion>$sdkVer</WindowsTargetPlatformVersion>" `
            -replace '<LanguageStandard>stdcpp20</LanguageStandard>', '<LanguageStandard>stdcpp20</LanguageStandard><PrecompiledHeader>NotUsing</PrecompiledHeader>' | Set-Content "xbox-uwp\App.vcxproj"

      - name: Restore NuGet Packages
        run: nuget restore xbox-uwp\XboxOTFM.sln -PackagesDirectory xbox-uwp\packages

      - name: Build & Package Signed MSIX (Release|x64)
        shell: pwsh
        run: |
          $sdkVer = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          msbuild xbox-uwp\XboxOTFM.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=$sdkVer `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageExtension=.msix `
            /p:PackageCertificateKeyFile=XboxOTFM_Cert.pfx `
            /p:PackageCertificatePassword=XboxOTFM2026! `
            /p:OutDir=..\build-out\ `
            /m

      - name: Sign MSIX & Collect DirectML
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdkBin.FullName "x64\signtool.exe"
          $msixFiles = Get-ChildItem -Path "xbox-uwp","build-out" -Recurse -Include *.msix,*.appx
          foreach ($pkg in $msixFiles) {
            Copy-Item $pkg.FullName -Destination "dist-xbox\" -Force
            & $signtool sign /fd SHA256 /f "xbox-uwp\XboxOTFM_Cert.pfx" /p "XboxOTFM2026!" (Join-Path "dist-xbox" $pkg.Name)
          }
          $deps = Get-ChildItem -Path "xbox-uwp\packages" -Recurse -Include DirectML.dll
          foreach ($d in $deps) {
            Copy-Item $d.FullName -Destination "dist-xbox\" -Force
          }

      - name: Upload Xbox MSIX Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xbox-OTFM-MSIX-Release-x64
          path: dist-xbox/
          if-no-files-found: warn
